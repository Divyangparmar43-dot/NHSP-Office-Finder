<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHS Professionals Office Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066cc;
            --primary-dark: #004a99;
            --success: #00a65a;
            --danger: #dd4b39;
            --light: #f4f4f4;
            --text: #333;
            --border: #ddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f9f9f9;
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER WITH SEARCH */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 0;
            margin: -20px -20px 40px -20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.05rem;
            opacity: 0.95;
            margin-bottom: 30px;
        }

        .search-box {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .input-wrapper {
            flex: 1;
            min-width: 240px;
        }

        #postcodeInput {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: 500;
            transition: all 0.3s;
        }

        #postcodeInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        .search-btn {
            padding: 14px 36px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-weight: 500;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fdeaea;
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .message.loading {
            background: #e3f2fd;
            color: var(--primary);
            border-left: 4px solid var(--primary);
        }

        /* MAIN SECTIONS */
        .trusts-section {
            display: block;
        }

        .trusts-section.hidden {
            display: none;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        /* TRUSTS DIRECTORY */
        .trusts-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--primary);
            font-weight: 700;
        }

        .trusts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .trust-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .trust-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .trust-card h3 {
            color: var(--primary);
            font-size: 1rem;
            margin-bottom: 12px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .trust-card-arrow {
            color: var(--success);
            font-weight: 700;
            margin-top: 8px;
        }

        /* RESULTS */
        .results-header {
            background: white;
            padding: 24px 30px;
            border-radius: 10px 10px 0 0;
            border-bottom: 3px solid var(--primary);
            margin-bottom: 0;
        }

        .results-header h2 {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .results-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .offices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            padding: 30px;
            background: white;
            border-radius: 0 0 10px 10px;
        }

        .office-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .office-card:hover {
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: 700;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.25);
        }

        .office-distance {
            color: var(--success);
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .office-trust {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .office-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .office-details {
            font-size: 0.9rem;
            line-height: 1.7;
            flex-grow: 1;
            margin-bottom: 18px;
        }

        .detail-row {
            margin-bottom: 14px;
        }

        .detail-label {
            font-weight: 700;
            color: var(--primary);
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #555;
            word-break: break-word;
        }

        .office-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 7px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-directions {
            background: var(--success);
            color: white;
        }

        .btn-directions:hover {
            background: #008a46;
        }

        .btn-trust {
            background: var(--primary);
            color: white;
        }

        .btn-trust:hover {
            background: var(--primary-dark);
        }

        /* LOADING */
        #loading {
            display: none;
            text-align: center;
            padding: 50px 20px;
            background: white;
            border-radius: 10px;
        }

        #loading.show {
            display: block;
        }

        .spinner {
            border: 5px solid var(--light);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* FOOTER */
        footer {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 0.95rem;
                margin-bottom: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .input-wrapper {
                min-width: 100%;
            }

            .trusts-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }

            .trust-card {
                padding: 16px;
            }

            .trust-card h3 {
                font-size: 0.9rem;
            }

            .offices-grid {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 16px;
            }

            .office-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

        // Initialize
        function init() {
            renderTrusts();
            document.getElementById('postcodeInput').focus();
        }

        function renderTrusts() {
            const grid = document.getElementById('trustsGrid');
            grid.innerHTML = TRUSTS.map(trust => `
                <a href="${trust.source}" target="_blank" class="trust-card">
                    <h3>${trust.name}</h3>
                    <div class="trust-card-arrow">→ Visit Staff Bank</div>
                </a>
            `).join('');
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function showMessage(text, type = 'error') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            if (type !== 'loading') setTimeout(() => msg.classList.remove('show'), 5000);
        }

        function isValidPostcode(postcode) {
            const regex = /^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/i;
            return regex.test(postcode.trim());
        }

        async function searchOffices() {
            const input = document.getElementById('postcodeInput').value.trim().toUpperCase();
            
            if (!input) {
                showMessage('Please enter a postcode', 'error');
                return;
            }

            if (!isValidPostcode(input)) {
                showMessage('Invalid postcode. Try: L12 2AP', 'error');
                return;
            }

            // Hide trusts, show loading
            document.getElementById('trustsSection').classList.add('hidden');
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultsSection').classList.remove('show');

            try {
                const userRes = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(input)}`);
                const userData = await userRes.json();

                if (!userData.result) {
                    showMessage('Postcode not found. Please try another.', 'error');
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('trustsSection').classList.remove('hidden');
                    return;
                }

                const userLat = userData.result.latitude;
                const userLon = userData.result.longitude;

                // Geocode all offices
                const officesWithCoords = [];
                for (const office of OFFICES) {
                    try {
                        const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(office.postcode)}`);
                        const data = await res.json();
                        
                        if (data.result) {
                            officesWithCoords.push({
                                ...office,
                                lat: data.result.latitude,
                                lon: data.result.longitude,
                                distance: calculateDistance(userLat, userLon, data.result.latitude, data.result.longitude)
                            });
                        }
                    } catch (e) {}
                    await new Promise(r => setTimeout(r, 50));
                }

                const topOffices = officesWithCoords.sort((a, b) => a.distance - b.distance).slice(0, 10);

                document.getElementById('loading').classList.remove('show');

                if (topOffices.length === 0) {
                    showMessage('No offices found nearby.', 'error');
                    document.getElementById('trustsSection').classList.remove('hidden');
                } else {
                    displayResults(topOffices, input);
                    document.getElementById('resultsSection').classList.add('show');
                }
            } catch (error) {
                showMessage('Error. Try again.', 'error');
                document.getElementById('loading').classList.remove('show');
                document.getElementById('trustsSection').classList.remove('hidden');
            }
        }

        function displayResults(offices, postcode) {
            document.getElementById('resultsInfo').textContent = `${offices.length} results near ${postcode.toUpperCase()}`;
            const container = document.getElementById('officesList');
            container.innerHTML = offices.map((office, index) => `
                <div class="office-card">
                    <div class="rank-badge">${index + 1}</div>
                    <div class="office-distance">${office.distance.toFixed(1)} km</div>
                    <div class="office-trust">${office.trust}</div>
                    <div class="office-name">${office.office || 'NHSP Office'}</div>
                    
                    <div class="office-details">
                        <div class="detail-row">
                            <span class="detail-label">📍 Address</span>
                            <span class="detail-value">${office.address}</span>
                        </div>
                        ${office.hours ? `<div class="detail-row"><span class="detail-label">⏰ Hours</span><span class="detail-value">${office.hours}</span></div>` : ''}
                        ${office.phone ? `<div class="detail-row"><span class="detail-label">📞 Phone</span><span class="detail-value">${office.phone}</span></div>` : ''}
                    </div>

                    <div class="office-actions">
                        <a href="https://www.google.com/maps/search/${encodeURIComponent(office.address)}" target="_blank" class="btn btn-directions">📍 Directions</a>
                        <a href="${office.source}" target="_blank" class="btn btn-trust">🔗 Trust Page</a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchBtn').addEventListener('click', searchOffices);
        document.getElementById('postcodeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchOffices();
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
